# Compila la app en GitHub (sin necesidad del PC) y publica el APK para instalarlo desde el celular:
# https://github.com/davidsant7e/el-carro-android/releases/tag/ultima
name: APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas y APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Nombre del APK
        run: cp app/build/outputs/apk/debug/app-debug.apk el-carro.apk

      - uses: actions/upload-artifact@v4
        with:
          name: el-carro-apk
          path: el-carro.apk

      - name: Publicar en «ultima»
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima
          name: El Carro (última compilación)
          prerelease: true
          files: el-carro.apk
          body: |
            APK de prueba compilado automáticamente desde `main` (${{ github.sha }}).
            En el celular: descarga **el-carro.apk** → ábrelo → permite «Instalar apps desconocidas» para el navegador → Instalar.
